<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Page UI</title>
</head>
<body>

 <!-- logo -->
<header>
  <div class="logo">Blogs</div>

  <div class="search">
    <input placeholder="Search blog page..." />
  </div>

  <nav>
    <a href="#">Explore</a>
    <a href="#">Hire</a>
    <a href="#">Community</a>
  </nav>
</header>

<!-- hero section -->
<section class="hero">
  <h1>Blog page</h1>
  <p>Browse blog page designs</p>

  <div class="related">
    Related:
    <span>blog post</span>
    <span>blog</span>
    <span>article</span>
    <span>landing page</span>
    <span>webdesign</span>
    <span>uidesign</span>
  </div>
</section>

<!-- filters -->
<div class="filters">
  <span>Popular</span>
  <span>Discover</span>
  <span>Animation</span>
  <span>Branding</span>
  <span>Mobile</span>
  <span>Product</span>
</div>

 <!-- filter panel -->
<div class="filters-right">
  <button id="filterButton">Filters</button>

  <div id="filterPanel" class="filter-panel">
    <h4>Tags</h4>
    <span>UI</span>
    <span>Blog</span>
    <span>Landing</span>

    <h4>Color</h4>
    <span>Light</span>
    <span>Dark</span>
    <span>Green</span>

    <h4>Framework</h4>
    <span>HTML</span>
    <span>React</span>
    <span>Vue</span>
  </div>
</div>



</body>
</html>
